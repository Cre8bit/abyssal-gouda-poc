<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abyssal — Underwater Multiplayer Prototype</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <!-- Three.js canvas container -->
    <div id="scene-container"></div>

    <!-- Underwater vignette + crosshair -->
    <div id="vignette"></div>
    <div id="crosshair"></div>

    <!-- World generation loading screen -->
    <div id="loader">
      <div class="loader-title">ABYSSAL</div>
      <div class="loader-sub">descending into the gouda labyrinth</div>
      <div class="loader-bar"><div id="loader-fill"></div></div>
      <div id="loader-label">charting the abyss…</div>
    </div>

    <!-- Dive HUD -->
    <div id="hud" class="hidden">
      <canvas id="compass" width="420" height="34"></canvas>
      <div id="gold-indicator">◆ GOLD — m</div>
      <div id="depth">▼ 0 m</div>
      <div id="voice-indicator">VOICE · off</div>
      <div id="event-center"></div>
      <button id="scatter-btn" class="hidden">⤨ Scatter (T)</button>
      <button id="mini-copy-link-btn" class="hidden" title="Copy invite link">
        📋
      </button>
    </div>

    <!-- UI overlay -->
    <div id="ui-overlay">
      <div id="menu" class="panel">
        <h1>Abyssal</h1>
        <p class="subtitle">Underwater P2P prototype</p>
        <button id="host-btn">Host Game</button>
        <button id="join-btn">Join Game</button>
        <p class="hint">
          Click the scene to look around · ZQSD/WASD to swim<br />Space / Shift
          to rise & sink · F flashlight · T scatter · V mute<br />Esc to release
          the mouse
        </p>
      </div>

      <div id="status" class="panel hidden">
        <p id="status-text"></p>
        <p id="peer-id" class="peer-id hidden"></p>
        <button id="copy-link-btn" class="hidden">📋 Copy invite link</button>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
