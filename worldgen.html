<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abyssal — World Gen Bench</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        background: #04141e;
      }
      body {
        font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
        font-size: 12px;
        color: #bfe0ee;
        user-select: none;
      }
      #stage {
        position: fixed;
        inset: 0;
      }
      #stage canvas {
        display: block;
      }

      #panel {
        position: fixed;
        top: 12px;
        left: 12px;
        width: 302px;
        max-height: calc(100vh - 24px);
        display: flex;
        flex-direction: column;
        background: rgba(3, 16, 24, 0.84);
        border: 1px solid #1d4457;
        border-radius: 8px;
        backdrop-filter: blur(6px);
      }
      #panel-head {
        padding: 12px 12px 0 12px;
      }
      #panel-body {
        padding: 0 12px 12px 12px;
        overflow-y: auto;
      }
      #panel h1 {
        font-size: 13px;
        letter-spacing: 2px;
        color: #7fd4ff;
        margin-bottom: 10px;
      }
      .nav {
        display: flex;
        gap: 4px;
        margin-bottom: 10px;
      }
      .nav a {
        flex: 1;
        text-align: center;
        text-decoration: none;
        font: inherit;
        color: #9fcbdd;
        background: #0a2635;
        border: 1px solid #1d4457;
        border-radius: 4px;
        padding: 4px 8px;
      }
      .nav a:hover {
        border-color: #3a7d9c;
        color: #d6f1ff;
      }
      .nav a.on {
        background: #12475e;
        border-color: #4fb3e0;
        color: #e8f8ff;
      }
      .section {
        margin-top: 12px;
      }
      .section .label {
        font-size: 10px;
        letter-spacing: 1.5px;
        color: #4f7f95;
        margin-bottom: 5px;
        text-transform: uppercase;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      button {
        font: inherit;
        color: #9fcbdd;
        background: #0a2635;
        border: 1px solid #1d4457;
        border-radius: 4px;
        padding: 4px 8px;
        cursor: pointer;
      }
      button:hover {
        border-color: #3a7d9c;
        color: #d6f1ff;
      }
      button.on {
        background: #12475e;
        border-color: #4fb3e0;
        color: #e8f8ff;
      }
      button.walk-btn.on {
        background: #14532d;
        border-color: #4ade80;
      }

      /* category chips */
      .cats {
        display: flex;
        flex-wrap: wrap;
        gap: 3px;
        margin-top: 12px;
        padding-bottom: 6px;
        border-bottom: 1px solid #123243;
      }
      .cats button {
        padding: 3px 8px;
        font-size: 11px;
        border-radius: 10px;
      }
      .cats button.on {
        background: #155a78;
        border-color: #4fb3e0;
      }

      .mood {
        margin-top: 8px;
        padding: 6px 8px;
        border-left: 2px solid #2a7da5;
        color: #8fc6da;
        font-style: italic;
        line-height: 1.4;
      }

      .slider-row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 5px;
      }
      .slider-row .name {
        width: 78px;
        color: #6fa3b8;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .slider-row .val {
        width: 46px;
        text-align: right;
        color: #d6f1ff;
      }
      .slider-row input[type="range"] {
        flex: 1;
        min-width: 0;
        accent-color: #4fb3e0;
      }
      .slider-row input.num {
        flex: 1;
        min-width: 0;
        font: inherit;
        color: #d6f1ff;
        background: #0a2635;
        border: 1px solid #1d4457;
        border-radius: 4px;
        padding: 2px 6px;
      }
      .slider-row input[type="color"] {
        flex: 1;
        min-width: 0;
        height: 22px;
        background: #0a2635;
        border: 1px solid #1d4457;
        border-radius: 4px;
        padding: 1px 2px;
      }
      .slider-row select {
        flex: 1;
        min-width: 0;
        font: inherit;
        color: #d6f1ff;
        background: #0a2635;
        border: 1px solid #1d4457;
        border-radius: 4px;
        padding: 3px 4px;
      }
      .text-row {
        margin-top: 6px;
      }
      .text-row .name {
        font-size: 10px;
        letter-spacing: 1px;
        color: #4f7f95;
        text-transform: uppercase;
        margin-bottom: 3px;
      }
      .text-row textarea {
        width: 100%;
        resize: vertical;
        font: inherit;
        font-size: 11px;
        line-height: 1.4;
        color: #bfe0ee;
        background: #0a2635;
        border: 1px solid #1d4457;
        border-radius: 4px;
        padding: 4px 6px;
      }
      .hint {
        margin-top: 10px;
        color: #3e6a7e;
        line-height: 1.5;
      }
      #hud {
        position: fixed;
        right: 12px;
        bottom: 12px;
        width: 250px;
        background: rgba(3, 16, 24, 0.82);
        border: 1px solid #1d4457;
        border-radius: 8px;
        padding: 10px 12px;
        backdrop-filter: blur(6px);
      }
      #hud .title {
        font-size: 10px;
        letter-spacing: 1.5px;
        color: #4f7f95;
        text-transform: uppercase;
        margin-bottom: 6px;
      }
      .hud-line {
        display: flex;
        justify-content: space-between;
        margin-top: 2px;
        gap: 8px;
      }
      .hud-line .k {
        color: #6fa3b8;
        white-space: nowrap;
      }
      .hud-line .v {
        color: #d6f1ff;
        text-align: right;
      }
      .hud-line .v.ok {
        color: #6ee7a0;
      }
      .hud-line .v.bad {
        color: #f87171;
      }

      #walk-hud {
        position: fixed;
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        display: none;
        background: rgba(3, 16, 24, 0.8);
        border: 1px solid #2a5a72;
        border-radius: 6px;
        padding: 6px 14px;
        color: #9fd8ef;
        letter-spacing: 1px;
        pointer-events: none;
      }
      #crosshair {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 4px;
        height: 4px;
        margin: -2px;
        border-radius: 50%;
        background: #9fd8ef;
        display: none;
        pointer-events: none;
      }

      #loading {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        color: #4f9cbf;
        letter-spacing: 3px;
        pointer-events: none;
        background: rgba(2, 10, 16, 0.35);
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>

    <div id="panel">
      <div id="panel-head">
        <div class="nav">
          <a href="./preview.html">models</a>
          <a class="on" href="./worldgen.html">world gen</a>
        </div>
        <h1>ABYSSAL · WORLD GEN</h1>
        <div class="row" id="modes"></div>
        <div id="generate"></div>
        <div id="subject"></div>
        <div class="cats" id="cats"></div>
      </div>
      <div id="panel-body">
        <div id="cat-body"></div>
        <div class="section">
          <div class="label">View</div>
          <div class="row" id="view-toggles"></div>
          <div id="view-sliders"></div>
        </div>
        <div class="section">
          <div class="label">Config</div>
          <div class="row" id="config-actions"></div>
        </div>
        <div class="hint" id="page-hint">
          drag orbit · wheel zoom · space reroll seed<br />
          F or ▶ walk = swim it like the player (esc exits)<br />
          edits autosave — "copy" dumps a recipes.ts entry
        </div>
      </div>
    </div>

    <div id="hud">
      <div class="title" id="hud-title">—</div>
      <div id="hud-body"></div>
    </div>

    <div id="walk-hud">
      WASD swim · mouse look · space ↑ · C ↓ · shift boost · esc exit
    </div>
    <div id="crosshair"></div>

    <div id="loading">carving…</div>

    <script type="module" src="/src/bench/worldgen.ts"></script>
  </body>
</html>
